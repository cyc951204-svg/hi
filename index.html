<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hand-osu! (Dual Hands)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        .input_video { display: none; }
        .output_canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: scaleX(-1); z-index: 1; }
        #beat-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,102,170,0.15) 0%, rgba(0,0,0,0) 70%); opacity: 0; z-index: 0; pointer-events: none; transition: opacity 0.05s; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        #score-board { color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px black; }
        #combo { font-size: 40px; color: #6cc; transition: transform 0.1s; display: inline-block; }
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; pointer-events: auto; color: white; text-align: center; }
        .music-selector { margin: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        input[type="file"] { display: none; }
        .custom-file-upload { border: 1px solid #ccc; display: inline-block; padding: 6px 12px; cursor: pointer; border-radius: 5px; background: #333; }
        #start-btn { padding: 15px 40px; font-size: 24px; background: #ff66aa; border: none; border-radius: 30px; color: white; cursor: pointer; margin-top: 20px; display: none; box-shadow: 0 0 15px #ff66aa; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff66aa; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #gesture-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="container">
        <video class="input_video" playsinline></video>
        <div id="beat-layer"></div>
        <canvas class="output_canvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">
                Score: <span id="score-val">0</span><br>
                <span id="combo">0x</span>
            </div>
            <div id="gesture-hint">支援雙手操作 • 左手(青) • 右手(紅)</div>
        </div>

        <div id="loading-screen">
            <div class="spinner" id="spinner"></div>
            <h2 id="status-text">初始化 AI (雙手模式)...<br>(首次需連網)</h2>
            <div class="music-selector" id="music-area" style="display:none;">
                <p>🎵 選擇音樂 (MP3)</p>
                <label for="music-upload" class="custom-file-upload">📂 瀏覽檔案</label>
                <input id="music-upload" type="file" accept="audio/*"/>
                <div id="music-name" style="margin-top:10px; font-size: 14px; color: #aaa;">預設示範曲</div>
            </div>
            <button id="start-btn">開始遊戲</button>
            <p style="font-size: 12px; margin-top: 10px; color: #aaa;">請允許相機權限</p>
        </div>
    </div>

    <script>
        // --- 1. Service Worker ---
        const DEMO_MUSIC_URL = 'https://cdn.pixabay.com/audio/2022/01/18/audio_d29094050b.mp3'; 
        const swCode = `
            const CACHE_NAME = 'ai-osu-dual-v1';
            self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(['./', 'index.html', '${DEMO_MUSIC_URL}']))); });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then((r) => r || fetch(e.request).then((res) => {
                    if(e.request.url.includes('mediapipe') || e.request.url.includes('gstatic')) {
                        let clone = res.clone(); caches.open(CACHE_NAME).then((c) => c.put(e.request, clone));
                    }
                    return res;
                })));
            });
        `;
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }

        // --- 2. 變數 ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const beatLayer = document.getElementById('beat-layer');
        const loadingScreen = document.getElementById('loading-screen');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const scoreEl = document.getElementById('score-val');
        const comboEl = document.getElementById('combo');
        const musicUpload = document.getElementById('music-upload');
        const musicName = document.getElementById('music-name');

        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let hitObjects = [];

        // --- 雙手狀態管理 ---
        // 我們使用字典來追蹤兩隻手的狀態，確保獨立判定
        const handStates = {
            'Left': { x: 0, y: 0, active: false, pinching: false, prevPinch: false, color: '#00ffff' },
            'Right': { x: 0, y: 0, active: false, pinching: false, prevPinch: false, color: '#ff00ff' }
        };
        // 為了處理 MediaPipe 有時只回傳一隻手且沒有標籤的情況，預設 keys
        const handKeys = ['Left', 'Right'];

        const AR = 1800; 
        const SPAWN_INTERVAL = 1000; // 稍微加快一點，因為有兩隻手
        const MAX_OBJECTS = 3; // 雙手可以處理更多物件
        let lastSpawnTime = 0;
        const CIRCLE_SIZE = 55;

        // --- 3. 音頻 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmSource = null, bgmBuffer = null;
        let analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        async function loadDefaultMusic() {
            try {
                const response = await fetch(DEMO_MUSIC_URL);
                const arrayBuffer = await response.arrayBuffer();
                bgmBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {}
        }
        loadDefaultMusic();

        musicUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            musicName.innerText = file.name;
            const reader = new FileReader();
            reader.onload = function(ev) {
                audioCtx.decodeAudioData(ev.target.result, function(buffer) {
                    bgmBuffer = buffer;
                    statusText.innerText = "音樂就緒！";
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function playBGM() {
            if (!bgmBuffer) return;
            if (bgmSource) bgmSource.stop();
            bgmSource = audioCtx.createBufferSource();
            bgmSource.buffer = bgmBuffer;
            bgmSource.loop = true;
            bgmSource.connect(analyser);
            analyser.connect(audioCtx.destination);
            bgmSource.start(0);
        }

        function playSfx(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if (type === 'hit') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else if (type === 'combo_break') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 4. MediaPipe ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        // ** 重要：開啟雙手偵測 **
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });
        
        hands.onResults(onResults);

        // --- 5. 遊戲邏輯 ---

        function spawnCircle() {
            const margin = 100;
            const x = margin + Math.random() * (canvasElement.width - margin * 2);
            const y = margin + Math.random() * (canvasElement.height - margin * 2);
            hitObjects.push({
                type: 'circle', x: x, y: y,
                spawnTime: Date.now(), hitTime: Date.now() + AR,
                hit: false, miss: false
            });
            lastSpawnTime = Date.now();
        }

        function spawnSlider() {
            const margin = 100;
            const startX = margin + Math.random() * (canvasElement.width - margin * 2);
            const startY = margin + Math.random() * (canvasElement.height - margin * 2);
            const angle = Math.random() * Math.PI * 2;
            const length = 200 + Math.random() * 200;
            const clampX = (v) => Math.max(margin, Math.min(v, canvasElement.width - margin));
            const clampY = (v) => Math.max(margin, Math.min(v, canvasElement.height - margin));

            hitObjects.push({
                type: 'slider', x: startX, y: startY,
                endX: clampX(startX + Math.cos(angle) * length),
                endY: clampY(startY + Math.sin(angle) * length),
                spawnTime: Date.now(), hitTime: Date.now() + AR,
                duration: 1000, endTime: Date.now() + AR + 1000,
                sliding: false, hit: false, miss: false
            });
            lastSpawnTime = Date.now();
        }

        function gameLoop() {
            if (!isGameRunning) return;
            const now = Date.now();
            analyser.getByteFrequencyData(dataArray);
            let bass = dataArray[0] + dataArray[1] + dataArray[2]; 
            
            if (bass > 300) beatLayer.style.opacity = (bass / 765) * 0.8;
            else beatLayer.style.opacity = 0;

            if (hitObjects.length < MAX_OBJECTS && (now - lastSpawnTime > SPAWN_INTERVAL)) {
                let shouldSpawn = (bass > 350) || (Math.random() < 0.05);
                if (shouldSpawn) {
                    if (Math.random() < 0.35) spawnSlider();
                    else spawnCircle();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            const now = Date.now();

            canvasCtx.save();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // --- 處理手部數據 ---
            // 1. 重置本幀 Active 狀態 (但不重置 prevPinch)
            handStates['Left'].active = false;
            handStates['Right'].active = false;

            if (results.multiHandLandmarks && results.multiHandedness) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const label = results.multiHandedness[i].label; // "Left" or "Right"
                    
                    // 注意：MediaPipe 的 Left/Right 是基於「人」的視角，
                    // 但因為我們可能在鏡像模式下，或者自拍鏡頭，標籤可能會反。
                    // 這裡我們直接信任標籤，反正有兩個不同的 key 就好。
                    let handKey = label; 
                    
                    // 座標更新
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    
                    if (handStates[handKey]) {
                        const h = handStates[handKey];
                        h.active = true;
                        h.x = indexTip.x * canvasElement.width;
                        h.y = indexTip.y * canvasElement.height;

                        // Pinch 判定
                        const dist = Math.sqrt(Math.pow((indexTip.x - thumbTip.x), 2) + Math.pow((indexTip.y - thumbTip.y), 2));
                        h.pinching = dist < 0.05;
                    }
                }
            }

            if (isGameRunning) updateGameObjects(now);
            drawHands();
            
            // 更新 PrevPinch
            handKeys.forEach(k => {
                handStates[k].prevPinch = handStates[k].pinching;
            });

            canvasCtx.restore();
        }

        function updateGameObjects(now) {
            for (let i = hitObjects.length - 1; i >= 0; i--) {
                let obj = hitObjects[i];
                let progress = (now - obj.spawnTime) / AR;
                if (progress > 1 && !obj.sliding) progress = 1;
                let approachRadius = CIRCLE_SIZE + (CIRCLE_SIZE * 3 * (1 - progress));
                if (approachRadius < CIRCLE_SIZE) approachRadius = CIRCLE_SIZE;

                // --- 繪製 ---
                if (obj.type === 'slider') {
                    // Slider 繪製
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(obj.x, obj.y);
                    canvasCtx.lineTo(obj.endX, obj.endY);
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.8; canvasCtx.lineCap = 'round';
                    canvasCtx.strokeStyle = 'rgba(80, 80, 80, 0.8)'; canvasCtx.stroke();
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.6;
                    canvasCtx.strokeStyle = 'rgba(30, 30, 30, 0.9)'; canvasCtx.stroke();

                    let slideProgress = 0;
                    if (now > obj.hitTime) {
                        slideProgress = (now - obj.hitTime) / obj.duration;
                        if (slideProgress > 1) slideProgress = 1;
                    }
                    let bx = obj.x + (obj.endX - obj.x) * slideProgress;
                    let by = obj.y + (obj.endY - obj.y) * slideProgress;

                    // 球體
                    canvasCtx.beginPath(); canvasCtx.arc(bx, by, CIRCLE_SIZE * 0.9, 0, 2 * Math.PI);
                    
                    if (obj.sliding) {
                        // 滑行中檢查：是否 *任一* 隻手正在 pinch 且在球附近
                        let tracking = false;
                        handKeys.forEach(k => {
                            let h = handStates[k];
                            if (h.active && h.pinching) {
                                let dist = Math.sqrt(Math.pow(h.x - bx, 2) + Math.pow(h.y - by, 2));
                                if (dist < CIRCLE_SIZE * 1.5) tracking = true;
                            }
                        });

                        if (tracking) {
                            canvasCtx.fillStyle = '#ffcc00'; score += 1; scoreEl.innerText = score;
                        } else {
                            canvasCtx.fillStyle = '#ff0000'; // 跟丟
                        }
                    } else { canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.9)'; }
                    
                    canvasCtx.fill(); canvasCtx.strokeStyle = 'white'; canvasCtx.lineWidth = 3; canvasCtx.stroke();
                    if (now < obj.hitTime) drawApproachCircle(obj.x, obj.y, approachRadius);

                } else {
                    drawHitCircle(obj.x, obj.y);
                    drawApproachCircle(obj.x, obj.y, approachRadius);
                }

                // --- 判定邏輯 (支援雙手) ---
                let endTime = obj.type === 'slider' ? obj.endTime : (obj.hitTime + 300);
                if (now > endTime && !obj.hit) {
                    playSfx('combo_break');
                    combo = 0; comboEl.innerText = "0x"; comboEl.style.color = "red";
                    hitObjects.splice(i, 1);
                    continue;
                }

                // 檢查是否被擊中
                if (!obj.hit && !obj.miss) {
                    // 遍歷左右手
                    handKeys.forEach(k => {
                        let h = handStates[k];
                        if (h.active && h.pinching && !h.prevPinch) { // 剛按下
                            let dist = Math.sqrt(Math.pow(h.x - obj.x, 2) + Math.pow(h.y - obj.y, 2));
                            if (dist < CIRCLE_SIZE) {
                                if (Math.abs(now - obj.hitTime) < 400) {
                                    playSfx('hit');
                                    if (obj.type === 'circle') {
                                        score += 300; addCombo(); obj.hit = true; // 標記為 hit，稍後移除或立即移除
                                        // 為了避免重複判定，直接在這裡處理移除邏輯
                                        hitObjects.splice(i, 1);
                                    } else {
                                        obj.hit = true; obj.sliding = true; addCombo();
                                    }
                                }
                            }
                        }
                    });
                }

                // Slider 結束
                if (obj.type === 'slider' && now >= obj.endTime) {
                    playSfx('hit'); score += 100; hitObjects.splice(i, 1);
                }
            }
        }

        function drawHitCircle(x, y) {
            canvasCtx.beginPath(); canvasCtx.arc(x, y, CIRCLE_SIZE, 0, 2 * Math.PI);
            canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.8)'; canvasCtx.fill();
            canvasCtx.lineWidth = 4; canvasCtx.strokeStyle = '#fff'; canvasCtx.stroke();
        }
        function drawApproachCircle(x, y, r) {
            canvasCtx.beginPath(); canvasCtx.arc(x, y, r, 0, 2 * Math.PI);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
        }
        function drawHands() {
            handKeys.forEach(k => {
                let h = handStates[k];
                if (h.active) {
                    canvasCtx.beginPath(); 
                    canvasCtx.arc(h.x, h.y, 15, 0, 2 * Math.PI);
                    // 捏合時變黃色，平時顯示各自的顏色 (左青 右紅)
                    canvasCtx.fillStyle = h.pinching ? '#ffff00' : h.color; 
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = '#fff'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
                    
                    // 寫出 Left/Right 字樣方便除錯
                    // canvasCtx.fillStyle = 'white'; canvasCtx.font = '12px Arial'; canvasCtx.fillText(k, h.x + 15, h.y);
                }
            });
        }
        function addCombo() {
            combo++; comboEl.innerText = combo + "x"; comboEl.style.color = "#6cc";
            comboEl.style.transform = "scale(1.5)"; setTimeout(() => comboEl.style.transform = "scale(1)", 100);
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 1280, height: 720, facingMode: 'user'
        });

        statusText.innerText = "初始化 AI...";
        camera.start().then(() => {
            spinner.style.display = 'none'; statusText.innerText = "準備就緒！";
            document.getElementById('music-area').style.display = 'block';
            startBtn.style.display = 'inline-block';
        }).catch(err => { statusText.innerText = "請使用 HTTPS 或允許相機"; });

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            loadingScreen.style.display = 'none'; isGameRunning = true;
            playBGM(); gameLoop();
        });
    </script>
</body>
</html>
