<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hand-osu! (On-Device)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 禁止手機預設觸控行為 */
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* 隱藏原始 Video，我們畫在 Canvas 上 */
        .input_video {
            display: none;
        }

        /* 遊戲主畫面 */
        .output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* 鏡像顯示 */
        }

        /* UI 層 (不鏡像) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        #score-board {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #combo {
            font-size: 40px;
            color: #6cc;
        }

        /* 載入畫面與開始按鈕 */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            color: white;
            text-align: center;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #ff66aa;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            display: none; /* 預設隱藏，模型載入後顯示 */
            box-shadow: 0 0 15px #ff66aa;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff66aa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 手勢提示 */
        #gesture-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="container">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">
                Score: <span id="score-val">0</span><br>
                <span id="combo">0x</span>
            </div>
            <div id="gesture-hint">食指移動游標 • 拇指捏合打擊</div>
        </div>

        <div id="loading-screen">
            <div class="spinner" id="spinner"></div>
            <h2 id="status-text">載入 AI 模型中...<br>(首次需連網)</h2>
            <button id="start-btn">開始遊戲</button>
            <p style="font-size: 12px; margin-top: 10px; color: #aaa;">請允許相機權限</p>
        </div>
    </div>

    <script>
        // --- 1. Service Worker 註冊 (實現離線功能) ---
        // 我們動態建立一個 SW 檔案內容，快取必要的 CDN 和 Assets
        const swCode = `
            const CACHE_NAME = 'ai-osu-cache-v1';
            const ASSETS = [
                './',
                'index.html',
                'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js',
                'https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js',
                'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js',
                'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js',
                // MediaPipe 依賴的資源 (WASM, TFLite) 通常由其 JS 動態載入
                // 這裡僅列出主要腳本，瀏覽器的 Cache API 通常會自動處理 fetch 請求
            ];

            self.addEventListener('install', (e) => {
                e.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => {
                        return cache.addAll(ASSETS);
                    })
                );
            });

            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    caches.match(e.request).then((response) => {
                        return response || fetch(e.request).then((response) => {
                            // 動態快取 MediaPipe 下載的模型檔案
                            if(e.request.url.includes('mediapipe') || e.request.url.includes('gstatic')) {
                                let responseClone = response.clone();
                                caches.open(CACHE_NAME).then((cache) => {
                                    cache.put(e.request, responseClone);
                                });
                            }
                            return response;
                        });
                    })
                );
            });
        `;

        // 將 SW 代碼轉換為 Blob URL 並註冊
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker 註冊成功', reg))
                .catch(err => console.log('Service Worker 註冊失敗', err));
        }

        // --- 2. 遊戲變數 ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        // UI
        const loadingScreen = document.getElementById('loading-screen');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const scoreEl = document.getElementById('score-val');
        const comboEl = document.getElementById('combo');

        // 遊戲狀態
        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let gameTime = 0;
        let lastFrameTime = 0;

        // 游標
        let cursorX = 0;
        let cursorY = 0;
        let isPinching = false;
        let prevPinch = false;

        // 物件管理 (Hit Objects)
        let hitObjects = [];
        const AR = 1500; // Approach Rate (ms) - 縮圈時間
        const CIRCLE_SIZE = 60; // 圈圈半徑
        
        // 音效 (使用 Web Audio API 生成簡單音效，不依賴外部檔案)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // --- 3. MediaPipe Setup ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // 0: 輕量, 1: 標準 (手機建議 0 或 1)
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // --- 4. 遊戲邏輯 ---

        function spawnCircle() {
            // 隨機產生圈圈，但避開邊緣
            const margin = 100;
            const x = margin + Math.random() * (canvasElement.width - margin * 2);
            const y = margin + Math.random() * (canvasElement.height - margin * 2);
            
            hitObjects.push({
                x: x,
                y: y,
                spawnTime: Date.now(),
                hitTime: Date.now() + AR, // 預計打擊時間
                hit: false,
                miss: false,
                id: Math.random()
            });
        }

        // 主迴圈
        function gameLoop() {
            if (!isGameRunning) return;

            // 生成邏輯 (簡單版：每 1 秒產生一個)
            const now = Date.now();
            if (Math.random() < 0.03 && hitObjects.length < 5) { 
                spawnCircle();
            }

            requestAnimationFrame(gameLoop);
        }

        // 處理每一幀的影像與 AI 結果
        function onResults(results) {
            // 設定 Canvas 尺寸 (隨視窗調整)
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            
            // 1. 繪製背景 (相機畫面)
            canvasCtx.save();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            // 加上一層半透明黑色，讓遊戲物件更明顯
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 2. 處理手勢
            let handDetected = false;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // 取得食指指尖 (Index Finger Tip: 8)
                const indexTip = landmarks[8];
                // 取得拇指指尖 (Thumb Tip: 4)
                const thumbTip = landmarks[4];

                // 座標轉換 (0-1 -> pixel)
                // 注意：因為 CSS scaleX(-1) 鏡像了 Canvas，但 JS 邏輯座標是原始的
                // 為了讓邏輯與視覺統一，我們在繪製物件時不需要反轉，但在判定時要注意視覺是反的
                // 簡單作法：視覺反轉，邏輯不反轉。
                // 這裡 cursorX 直接取 raw data，但在繪製 cursor 時，因為 canvas 已經 flip，所以畫上去會是對的。
                cursorX = indexTip.x * canvasElement.width;
                cursorY = indexTip.y * canvasElement.height;

                // 計算 Pinch (拇指與食指距離)
                // 簡單的歐氏距離
                const distance = Math.sqrt(
                    Math.pow((indexTip.x - thumbTip.x), 2) + 
                    Math.pow((indexTip.y - thumbTip.y), 2)
                ); // 這裡距離是 normalized (0-1)

                // 判定閾值
                const pinchThreshold = 0.05; 
                isPinching = distance < pinchThreshold;

                // 繪製手部骨架 (選用)
                // drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 1});
            }

            // 3. 繪製與更新遊戲物件
            if (isGameRunning) {
                updateAndDrawGameObjects(now = Date.now());
            }

            // 4. 繪製游標
            if (handDetected) {
                drawCursor();
            }

            canvasCtx.restore();
        }

        function updateAndDrawGameObjects(now) {
            // 清理過期物件
            for (let i = hitObjects.length - 1; i >= 0; i--) {
                let obj = hitObjects[i];
                
                // Miss 判定
                if (now > obj.hitTime + 200 && !obj.hit) {
                    obj.miss = true;
                    combo = 0;
                    comboEl.innerText = "0x";
                    hitObjects.splice(i, 1);
                    continue;
                }

                // 計算進度 (0:剛生成, 1:完美重合)
                let progress = (now - obj.spawnTime) / AR;
                if (progress > 1) progress = 1;

                // 繪製 Hit Circle
                canvasCtx.beginPath();
                canvasCtx.arc(obj.x, obj.y, CIRCLE_SIZE, 0, 2 * Math.PI);
                canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.8)'; // osu! pink
                canvasCtx.fill();
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();

                // 繪製 Approach Circle (縮圈)
                let approachRadius = CIRCLE_SIZE + (CIRCLE_SIZE * 2 * (1 - progress));
                if (approachRadius < CIRCLE_SIZE) approachRadius = CIRCLE_SIZE;

                canvasCtx.beginPath();
                canvasCtx.arc(obj.x, obj.y, approachRadius, 0, 2 * Math.PI);
                canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                canvasCtx.stroke();

                // 數字 ID (裝飾)
                canvasCtx.fillStyle = 'white';
                canvasCtx.font = '30px Arial';
                canvasCtx.textAlign = 'center';
                canvasCtx.textBaseline = 'middle';
                canvasCtx.fillText("1", obj.x, obj.y);

                // Hit 判定邏輯
                // 條件：Pinch 觸發 (剛按下) 且 游標在圈內 且 時間在判定區間內
                if (isPinching && !prevPinch) { // Trigger on press down
                    // 計算游標與圓心距離
                    let dist = Math.sqrt(Math.pow(cursorX - obj.x, 2) + Math.pow(cursorY - obj.y, 2));
                    
                    if (dist < CIRCLE_SIZE) {
                        // 判定時間準度 (簡單版：只要圈圈夠小就可以)
                        let timeDiff = Math.abs(now - obj.hitTime);
                        if (timeDiff < 300) { // 300ms 寬容度
                            // Hit!
                            playHitSound();
                            score += 300;
                            combo++;
                            scoreEl.innerText = score;
                            comboEl.innerText = combo + "x";
                            
                            // 視覺特效 (簡單一閃)
                            canvasCtx.beginPath();
                            canvasCtx.arc(obj.x, obj.y, CIRCLE_SIZE * 1.2, 0, 2 * Math.PI);
                            canvasCtx.strokeStyle = '#ffcc00';
                            canvasCtx.stroke();

                            hitObjects.splice(i, 1); // 移除
                            continue;
                        }
                    }
                }
            }
            prevPinch = isPinching;
        }

        function drawCursor() {
            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, 15, 0, 2 * Math.PI);
            canvasCtx.fillStyle = isPinching ? '#ffff00' : '#00ffff'; // 捏合變黃色，平常青色
            canvasCtx.fill();
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
            
            // 拖尾效果 (Visual Trail - Optional for simplicity omitted)
        }


        // --- 5. 初始化與啟動 ---
        
        // 啟動相機
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'user' // 自拍鏡頭
        });

        // 監聽載入完成
        // MediaPipe 沒有明確的 "Model Loaded" event，我們透過第一次 successful inference 或簡單的 timeout 判斷
        // 這裡做一個簡單的機制：當畫面上有東西跑時，或者等待幾秒後顯示開始按鈕
        
        statusText.innerText = "正在初始化相機與模型...";
        
        camera.start()
            .then(() => {
                console.log("Camera started");
                // 假設相機啟動後，模型很快就好。顯示按鈕。
                spinner.style.display = 'none';
                statusText.innerText = "準備就緒！\n請確保環境光線充足";
                startBtn.style.display = 'block';
            })
            .catch(err => {
                console.error(err);
                statusText.innerText = "無法啟動相機。\n請確認權限或使用 HTTPS。";
                spinner.style.display = 'none';
            });

        startBtn.addEventListener('click', () => {
            // 進入全螢幕 (如果支援)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            }
            
            loadingScreen.style.display = 'none';
            isGameRunning = true;
            score = 0;
            combo = 0;
            scoreEl.innerText = "0";
            comboEl.innerText = "0x";
            
            // 啟動音效 Context (因為瀏覽器需要 user interaction)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            gameLoop();
        });

    </script>
</body>
</html>
