<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hand-osu! (With Sliders)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .input_video { display: none; }

        .output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* 鏡像 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        #score-board {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #combo {
            font-size: 40px;
            color: #6cc;
            transition: transform 0.1s;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            color: white;
            text-align: center;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #ff66aa;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            box-shadow: 0 0 15px #ff66aa;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff66aa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #gesture-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="container">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">
                Score: <span id="score-val">0</span><br>
                <span id="combo">0x</span>
            </div>
            <div id="gesture-hint">食指移動 • 拇指捏合打擊 • 滑條需按住不放</div>
        </div>

        <div id="loading-screen">
            <div class="spinner" id="spinner"></div>
            <h2 id="status-text">載入 AI 模型中...<br>(首次需連網)</h2>
            <button id="start-btn">開始遊戲</button>
            <p style="font-size: 12px; margin-top: 10px; color: #aaa;">請允許相機權限</p>
        </div>
    </div>

    <script>
        // --- Service Worker (離線支援) ---
        const swCode = `
            const CACHE_NAME = 'ai-osu-slider-v2';
            self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(['./', 'index.html']))); });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then((r) => r || fetch(e.request).then((res) => {
                    if(e.request.url.includes('mediapipe') || e.request.url.includes('gstatic')) {
                        let clone = res.clone(); caches.open(CACHE_NAME).then((c) => c.put(e.request, clone));
                    }
                    return res;
                })));
            });
        `;
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }

        // --- 變數設定 ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        const loadingScreen = document.getElementById('loading-screen');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const scoreEl = document.getElementById('score-val');
        const comboEl = document.getElementById('combo');

        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let lastFrameTime = 0;

        let cursorX = 0;
        let cursorY = 0;
        let isPinching = false;
        let prevPinch = false;

        let hitObjects = [];
        const AR = 1500; // Approach Rate
        const CIRCLE_SIZE = 50; 
        
        // --- 音效系統 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            } else if (type === 'slide') {
                // 滑行時的輕微連續音 (這裡只做短音模擬)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- MediaPipe 設定 ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        // --- 遊戲生成邏輯 ---

        function spawnCircle() {
            const margin = 100;
            const x = margin + Math.random() * (canvasElement.width - margin * 2);
            const y = margin + Math.random() * (canvasElement.height - margin * 2);
            hitObjects.push({
                type: 'circle',
                x: x, y: y,
                spawnTime: Date.now(),
                hitTime: Date.now() + AR,
                hit: false, miss: false
            });
        }

        function spawnSlider() {
            const margin = 100;
            const startX = margin + Math.random() * (canvasElement.width - margin * 2);
            const startY = margin + Math.random() * (canvasElement.height - margin * 2);
            // 隨機方向與長度
            const angle = Math.random() * Math.PI * 2;
            const length = 200 + Math.random() * 200;
            const endX = startX + Math.cos(angle) * length;
            const endY = startY + Math.sin(angle) * length;

            // 確保不出界 (簡單 clamp)
            const clampX = (v) => Math.max(margin, Math.min(v, canvasElement.width - margin));
            const clampY = (v) => Math.max(margin, Math.min(v, canvasElement.height - margin));

            hitObjects.push({
                type: 'slider',
                x: startX, y: startY, // 起點 (Head)
                endX: clampX(endX), endY: clampY(endY), // 終點 (Tail)
                spawnTime: Date.now(),
                hitTime: Date.now() + AR, // 頭部到達時間
                duration: 1000, // 滑行時間 (ms)
                endTime: Date.now() + AR + 1000, // 結束時間
                sliding: false, // 是否正在滑行中
                hit: false, miss: false
            });
        }

        function gameLoop() {
            if (!isGameRunning) return;
            // 隨機生成物件
            if (Math.random() < 0.02 && hitObjects.length < 4) {
                if (Math.random() < 0.4) spawnSlider(); // 40% 機率是滑條
                else spawnCircle();
            }
            requestAnimationFrame(gameLoop);
        }

        // --- 繪圖與判定主核心 ---

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            const now = Date.now();

            // 1. 繪製背景
            canvasCtx.save();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 2. 更新手勢座標
            let handDetected = false;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const lm = results.multiHandLandmarks[0];
                const indexTip = lm[8];
                const thumbTip = lm[4];

                cursorX = indexTip.x * canvasElement.width;
                cursorY = indexTip.y * canvasElement.height;

                const dist = Math.sqrt(Math.pow((indexTip.x - thumbTip.x), 2) + Math.pow((indexTip.y - thumbTip.y), 2));
                isPinching = dist < 0.05;
            } else {
                isPinching = false;
            }

            // 3. 處理遊戲物件
            if (isGameRunning) {
                updateGameObjects(now);
            }

            // 4. 繪製游標
            if (handDetected) {
                drawCursor();
            }
            canvasCtx.restore();
        }

        function updateGameObjects(now) {
            // 根據 hitTime 排序繪製 (先出的在下面，這裡其實沒差太多)
            // 為了視覺正確，我們倒序處理邏輯，但繪製可能需要順序
            
            for (let i = hitObjects.length - 1; i >= 0; i--) {
                let obj = hitObjects[i];

                // === 繪製邏輯 (Visuals) ===
                let progress = (now - obj.spawnTime) / AR;
                if (progress > 1 && !obj.sliding) progress = 1;

                // 縮圈大小
                let approachRadius = CIRCLE_SIZE + (CIRCLE_SIZE * 3 * (1 - progress));
                if (approachRadius < CIRCLE_SIZE) approachRadius = CIRCLE_SIZE;

                if (obj.type === 'slider') {
                    // 繪製滑條軌道
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(obj.x, obj.y);
                    canvasCtx.lineTo(obj.endX, obj.endY);
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.8;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.strokeStyle = 'rgba(100, 100, 100, 0.8)'; // 外框
                    canvasCtx.stroke();
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.6;
                    canvasCtx.strokeStyle = 'rgba(40, 40, 40, 0.9)'; // 內軌
                    canvasCtx.stroke();

                    // 計算球體位置
                    let slideProgress = 0;
                    if (now > obj.hitTime) {
                        slideProgress = (now - obj.hitTime) / obj.duration;
                        if (slideProgress > 1) slideProgress = 1;
                    }
                    
                    let ballX = obj.x + (obj.endX - obj.x) * slideProgress;
                    let ballY = obj.y + (obj.endY - obj.y) * slideProgress;

                    // 繪製球體
                    canvasCtx.beginPath();
                    canvasCtx.arc(ballX, ballY, CIRCLE_SIZE * 0.9, 0, 2 * Math.PI);
                    // 根據是否正在追蹤變色
                    if (obj.sliding) {
                         // 檢查是否跟丟 (必須捏合且距離夠近)
                         let dist = Math.sqrt(Math.pow(cursorX - ballX, 2) + Math.pow(cursorY - ballY, 2));
                         if (isPinching && dist < CIRCLE_SIZE * 1.5) {
                             canvasCtx.fillStyle = '#ffcc00'; // 追蹤中 (黃色)
                             score += 1; // 持續得分
                             scoreEl.innerText = score;
                         } else {
                             canvasCtx.fillStyle = '#ff0000'; // 跟丟 (紅色)
                             // 嚴格模式可以在這裡斷 Combo
                         }
                    } else {
                        canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.9)';
                    }
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = 'white';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.stroke();

                    // 繪製縮圈 (只在頭部被擊中前顯示)
                    if (now < obj.hitTime) {
                        drawApproachCircle(obj.x, obj.y, approachRadius);
                    }

                } else {
                    // Circle
                    drawHitCircle(obj.x, obj.y);
                    drawApproachCircle(obj.x, obj.y, approachRadius);
                }

                // === 判定邏輯 (Logic) ===

                // 1. Miss 判定
                // Circle: 時間過太久
                // Slider: 時間超過結束時間
                let endTime = obj.type === 'slider' ? obj.endTime : (obj.hitTime + 200);
                if (now > endTime && !obj.hit) {
                    // Slider 特例: 如果有開始滑，算完成一半? 這裡簡化為只要結束時沒做完就移除
                    handleMiss(i);
                    continue;
                }
                
                // 2. Hit 判定 (針對 Head)
                // 必須是「剛按下」(isPinching && !prevPinch)
                if (isPinching && !prevPinch && !obj.hit && !obj.miss) {
                    let dist = Math.sqrt(Math.pow(cursorX - obj.x, 2) + Math.pow(cursorY - obj.y, 2));
                    if (dist < CIRCLE_SIZE) {
                        let timeDiff = Math.abs(now - obj.hitTime);
                        if (timeDiff < 300) {
                            // Hit Head!
                            playSound('hit');
                            if (obj.type === 'circle') {
                                score += 300;
                                addCombo();
                                hitObjects.splice(i, 1); // 圓圈打完直接移除
                            } else {
                                // Slider Start
                                obj.hit = true; // 標記頭部已擊中
                                obj.sliding = true; // 開始滑行
                                addCombo();
                            }
                            continue;
                        }
                    }
                }

                // 3. Slider 完成判定
                if (obj.type === 'slider' && now >= obj.endTime) {
                    // 時間到，移除
                    playSound('hit'); // 尾部音效
                    score += 100; // 尾部得分
                    hitObjects.splice(i, 1);
                }
            }
            prevPinch = isPinching;
        }

        function drawHitCircle(x, y) {
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, CIRCLE_SIZE, 0, 2 * Math.PI);
            canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.8)';
            canvasCtx.fill();
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
        }

        function drawApproachCircle(x, y, r) {
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, r, 0, 2 * Math.PI);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
        }

        function drawCursor() {
            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, 15, 0, 2 * Math.PI);
            canvasCtx.fillStyle = isPinching ? '#ffff00' : '#00ffff'; 
            canvasCtx.fill();
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
        }

        function addCombo() {
            combo++;
            comboEl.innerText = combo + "x";
            // 簡單動畫
            comboEl.style.transform = "scale(1.5)";
            setTimeout(() => comboEl.style.transform = "scale(1)", 100);
        }

        function handleMiss(index) {
            combo = 0;
            comboEl.innerText = "0x";
            comboEl.style.color = "red";
            setTimeout(() => comboEl.style.color = "#6cc", 200);
            hitObjects.splice(index, 1);
        }

        // --- 初始化相機 ---
        const camera = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 1280, height: 720, facingMode: 'user'
        });

        statusText.innerText = "正在初始化相機與模型...";
        camera.start().then(() => {
            spinner.style.display = 'none';
            statusText.innerText = "準備就緒！\n請確保環境光線充足";
            startBtn.style.display = 'block';
        }).catch(err => {
            statusText.innerText = "錯誤：需使用 HTTPS 或允許相機權限";
        });

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            loadingScreen.style.display = 'none';
            isGameRunning = true;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            gameLoop();
        });
    </script>
</body>
</html>
