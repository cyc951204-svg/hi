<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hand-osu! (Music Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #container { position: relative; width: 100vw; height: 100vh; }
        .input_video { display: none; }
        
        .output_canvas {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* 背景律動層 */
        #beat-layer {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,102,170,0.1) 0%, rgba(0,0,0,0) 70%);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.05s;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }

        #score-board {
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #combo { font-size: 40px; color: #6cc; transition: transform 0.1s; }

        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; pointer-events: auto; color: white; text-align: center;
        }

        /* 音樂選擇區塊 */
        .music-selector {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .custom-file-upload {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 5px;
            background: #333;
            transition: background 0.3s;
        }
        .custom-file-upload:hover { background: #555; }

        #start-btn {
            padding: 15px 40px; font-size: 24px;
            background: #ff66aa; border: none; border-radius: 30px;
            color: white; cursor: pointer; margin-top: 20px;
            display: none; box-shadow: 0 0 15px #ff66aa;
        }

        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #ff66aa;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #gesture-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 14px; text-align: center;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="container">
        <video class="input_video" playsinline></video>
        <div id="beat-layer"></div> <canvas class="output_canvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">
                Score: <span id="score-val">0</span><br>
                <span id="combo">0x</span>
            </div>
            <div id="gesture-hint">食指移動 • 拇指捏合打擊 • 滑條需按住</div>
        </div>

        <div id="loading-screen">
            <div class="spinner" id="spinner"></div>
            <h2 id="status-text">載入 AI 模型中...<br>(首次需連網)</h2>
            
            <div class="music-selector" id="music-area" style="display:none;">
                <p>🎵 選擇背景音樂 (選填)</p>
                <label for="music-upload" class="custom-file-upload">
                    📂 選擇 MP3 檔案
                </label>
                <input id="music-upload" type="file" accept="audio/*"/>
                <div id="music-name" style="margin-top:10px; font-size: 14px; color: #aaa;">使用預設示範曲</div>
            </div>

            <button id="start-btn">開始遊戲</button>
            <p style="font-size: 12px; margin-top: 10px; color: #aaa;">請允許相機權限</p>
        </div>
    </div>

    <script>
        // --- 1. Service Worker & Caching (含 Demo Music) ---
        // 預設示範曲 (Pixabay 免費素材)
        const DEMO_MUSIC_URL = 'https://cdn.pixabay.com/audio/2022/01/18/audio_d29094050b.mp3'; 
        
        const swCode = `
            const CACHE_NAME = 'ai-osu-music-v3';
            const ASSETS = [
                './', 'index.html',
                '${DEMO_MUSIC_URL}' // 快取音樂
            ];
            self.addEventListener('install', (e) => { 
                e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(ASSETS))); 
            });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then((r) => r || fetch(e.request).then((res) => {
                    if(e.request.url.includes('mediapipe') || e.request.url.includes('gstatic')) {
                        let clone = res.clone(); caches.open(CACHE_NAME).then((c) => c.put(e.request, clone));
                    }
                    return res;
                })));
            });
        `;
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }

        // --- 2. 變數與設置 ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const beatLayer = document.getElementById('beat-layer');
        
        // UI
        const loadingScreen = document.getElementById('loading-screen');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const musicArea = document.getElementById('music-area');
        const musicUpload = document.getElementById('music-upload');
        const musicName = document.getElementById('music-name');
        const scoreEl = document.getElementById('score-val');
        const comboEl = document.getElementById('combo');

        // Game State
        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let cursorX = 0, cursorY = 0;
        let isPinching = false, prevPinch = false;
        let hitObjects = [];
        const AR = 1500; // Approach Rate
        const CIRCLE_SIZE = 50;

        // --- 3. 音頻系統 (BGM & SFX) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmSource = null;
        let bgmBuffer = null;
        let analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        // 載入預設音樂
        async function loadDefaultMusic() {
            try {
                const response = await fetch(DEMO_MUSIC_URL);
                const arrayBuffer = await response.arrayBuffer();
                bgmBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                console.log("預設音樂載入完成");
            } catch (e) {
                console.log("預設音樂載入失敗 (可能離線且未快取)", e);
            }
        }
        loadDefaultMusic();

        // 處理使用者上傳
        musicUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            musicName.innerText = "已選擇: " + file.name;
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                audioCtx.decodeAudioData(ev.target.result, function(buffer) {
                    bgmBuffer = buffer;
                    statusText.innerText = "音樂解析完成！可以開始";
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function playBGM() {
            if (!bgmBuffer) return;
            if (bgmSource) bgmSource.stop();
            bgmSource = audioCtx.createBufferSource();
            bgmSource.buffer = bgmBuffer;
            bgmSource.loop = true; // 循環播放
            bgmSource.connect(analyser); // 連接到分析器
            analyser.connect(audioCtx.destination); // 連接到喇叭
            bgmSource.start(0);
        }

        // 音效 (SFX)
        function playSfx(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // 稍微小聲一點以免蓋過音樂
            } else if (type === 'combo_break') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 4. MediaPipe Setup ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        // --- 5. 遊戲邏輯 ---

        function spawnCircle() {
            const margin = 100;
            const x = margin + Math.random() * (canvasElement.width - margin * 2);
            const y = margin + Math.random() * (canvasElement.height - margin * 2);
            hitObjects.push({
                type: 'circle', x: x, y: y,
                spawnTime: Date.now(), hitTime: Date.now() + AR,
                hit: false, miss: false
            });
        }

        function spawnSlider() {
            const margin = 100;
            const startX = margin + Math.random() * (canvasElement.width - margin * 2);
            const startY = margin + Math.random() * (canvasElement.height - margin * 2);
            const angle = Math.random() * Math.PI * 2;
            const length = 200 + Math.random() * 200;
            const clampX = (v) => Math.max(margin, Math.min(v, canvasElement.width - margin));
            const clampY = (v) => Math.max(margin, Math.min(v, canvasElement.height - margin));

            hitObjects.push({
                type: 'slider', x: startX, y: startY,
                endX: clampX(startX + Math.cos(angle) * length),
                endY: clampY(startY + Math.sin(angle) * length),
                spawnTime: Date.now(), hitTime: Date.now() + AR,
                duration: 1000, endTime: Date.now() + AR + 1000,
                sliding: false, hit: false, miss: false
            });
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // 根據音樂分析控制生成率 (簡單版：隨機)
            // 進階：如果 bass 很大聲，生成機率提高
            analyser.getByteFrequencyData(dataArray);
            let bass = dataArray[0] + dataArray[1] + dataArray[2]; // 取低頻
            
            // 視覺化：背景閃爍
            if (bass > 300) { // 閾值
                 beatLayer.style.opacity = (bass / 765) * 0.8; // 0-255 * 3
            } else {
                 beatLayer.style.opacity = 0;
            }

            // 生成物件 (機率隨 Bass 增加)
            let spawnChance = 0.02 + (bass / 10000); 
            if (Math.random() < spawnChance && hitObjects.length < 5) {
                if (Math.random() < 0.4) spawnSlider();
                else spawnCircle();
            }

            requestAnimationFrame(gameLoop);
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            const now = Date.now();

            canvasCtx.save();
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.6)'; // 變暗一點以凸顯特效
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 手勢追蹤
            let handDetected = false;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const lm = results.multiHandLandmarks[0];
                const indexTip = lm[8];
                const thumbTip = lm[4];
                cursorX = indexTip.x * canvasElement.width;
                cursorY = indexTip.y * canvasElement.height;
                const dist = Math.sqrt(Math.pow((indexTip.x - thumbTip.x), 2) + Math.pow((indexTip.y - thumbTip.y), 2));
                isPinching = dist < 0.05;
            } else { isPinching = false; }

            if (isGameRunning) updateGameObjects(now);
            if (handDetected) drawCursor();
            canvasCtx.restore();
        }

        function updateGameObjects(now) {
            for (let i = hitObjects.length - 1; i >= 0; i--) {
                let obj = hitObjects[i];
                let progress = (now - obj.spawnTime) / AR;
                if (progress > 1 && !obj.sliding) progress = 1;
                let approachRadius = CIRCLE_SIZE + (CIRCLE_SIZE * 3 * (1 - progress));
                if (approachRadius < CIRCLE_SIZE) approachRadius = CIRCLE_SIZE;

                // --- 繪製 ---
                if (obj.type === 'slider') {
                    // 軌道
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(obj.x, obj.y);
                    canvasCtx.lineTo(obj.endX, obj.endY);
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.8;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.strokeStyle = 'rgba(80, 80, 80, 0.8)';
                    canvasCtx.stroke();
                    canvasCtx.lineWidth = CIRCLE_SIZE * 1.6;
                    canvasCtx.strokeStyle = 'rgba(30, 30, 30, 0.9)';
                    canvasCtx.stroke();

                    // 球體
                    let slideProgress = 0;
                    if (now > obj.hitTime) {
                        slideProgress = (now - obj.hitTime) / obj.duration;
                        if (slideProgress > 1) slideProgress = 1;
                    }
                    let bx = obj.x + (obj.endX - obj.x) * slideProgress;
                    let by = obj.y + (obj.endY - obj.y) * slideProgress;

                    canvasCtx.beginPath();
                    canvasCtx.arc(bx, by, CIRCLE_SIZE * 0.9, 0, 2 * Math.PI);
                    
                    if (obj.sliding) {
                         let dist = Math.sqrt(Math.pow(cursorX - bx, 2) + Math.pow(cursorY - by, 2));
                         if (isPinching && dist < CIRCLE_SIZE * 1.5) {
                             canvasCtx.fillStyle = '#ffcc00'; // 追蹤成功
                             score += 1; scoreEl.innerText = score;
                         } else {
                             canvasCtx.fillStyle = '#ff0000'; // 脫軌
                         }
                    } else {
                        canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.9)';
                    }
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = 'white'; canvasCtx.lineWidth = 3; canvasCtx.stroke();
                    if (now < obj.hitTime) drawApproachCircle(obj.x, obj.y, approachRadius);

                } else { // Circle
                    drawHitCircle(obj.x, obj.y);
                    drawApproachCircle(obj.x, obj.y, approachRadius);
                }

                // --- 判定 ---
                let endTime = obj.type === 'slider' ? obj.endTime : (obj.hitTime + 200);
                if (now > endTime && !obj.hit) {
                    playSfx('combo_break');
                    combo = 0; comboEl.innerText = "0x"; comboEl.style.color = "red";
                    hitObjects.splice(i, 1);
                    continue;
                }

                if (isPinching && !prevPinch && !obj.hit && !obj.miss) {
                    let dist = Math.sqrt(Math.pow(cursorX - obj.x, 2) + Math.pow(cursorY - obj.y, 2));
                    if (dist < CIRCLE_SIZE) {
                        if (Math.abs(now - obj.hitTime) < 300) {
                            playSfx('hit');
                            if (obj.type === 'circle') {
                                score += 300; addCombo(); hitObjects.splice(i, 1);
                            } else {
                                obj.hit = true; obj.sliding = true; addCombo();
                            }
                            continue;
                        }
                    }
                }
                if (obj.type === 'slider' && now >= obj.endTime) {
                    playSfx('hit'); score += 100; hitObjects.splice(i, 1);
                }
            }
            prevPinch = isPinching;
        }

        function drawHitCircle(x, y) {
            canvasCtx.beginPath(); canvasCtx.arc(x, y, CIRCLE_SIZE, 0, 2 * Math.PI);
            canvasCtx.fillStyle = 'rgba(255, 102, 170, 0.8)'; canvasCtx.fill();
            canvasCtx.lineWidth = 4; canvasCtx.strokeStyle = '#fff'; canvasCtx.stroke();
        }
        function drawApproachCircle(x, y, r) {
            canvasCtx.beginPath(); canvasCtx.arc(x, y, r, 0, 2 * Math.PI);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
        }
        function drawCursor() {
            canvasCtx.beginPath(); canvasCtx.arc(cursorX, cursorY, 15, 0, 2 * Math.PI);
            canvasCtx.fillStyle = isPinching ? '#ffff00' : '#00ffff'; canvasCtx.fill();
            canvasCtx.strokeStyle = '#fff'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
        }
        function addCombo() {
            combo++; comboEl.innerText = combo + "x"; comboEl.style.color = "#6cc";
            comboEl.style.transform = "scale(1.5)"; setTimeout(() => comboEl.style.transform = "scale(1)", 100);
        }

        // --- Init ---
        const camera = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 1280, height: 720, facingMode: 'user'
        });

        statusText.innerText = "初始化相機...";
        camera.start().then(() => {
            spinner.style.display = 'none';
            statusText.innerText = "準備就緒！";
            musicArea.style.display = 'block'; // 顯示音樂選擇
            startBtn.style.display = 'inline-block';
        }).catch(err => {
            statusText.innerText = "請允許相機權限或使用 HTTPS";
            console.error(err);
        });

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            
            // 啟動音訊環境 (必須在 user gesture 內)
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            loadingScreen.style.display = 'none';
            isGameRunning = true;
            playBGM(); // 播放音樂
            gameLoop();
        });
    </script>
</body>
</html>
